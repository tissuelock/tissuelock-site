<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tissuelock hero preview</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#071624;color:#fff;font-family:'Schibsted Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .hero{min-height:100svh;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:clamp(14px,2.4vh,40px);background:linear-gradient(180deg,#071624 0%,#0A1A2B 62%,#0E2337 100%);padding:clamp(60px,9vh,96px) clamp(18px,4vw,54px) clamp(28px,4vh,48px);box-sizing:border-box}
  .art{position:relative;width:min(96vw,1040px);margin:0 auto;min-height:280px;height:100%}
  h1{margin:0;font-size:clamp(44px,8vw,132px);font-weight:500;line-height:.92;letter-spacing:-.052em}
  h1 span{color:#7FC4E8}
  .tag{position:fixed;top:14px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:.14em;color:#9FC6E2;background:rgba(10,26,43,.7);border:1px solid rgba(127,196,232,.3);padding:6px 12px;border-radius:999px}
</style></head>
<body>
<div class="tag">PREVIEW — NOT ON THE LIVE HOMEPAGE YET</div>
<section class="hero">
  <div class="art" id="art"></div>
  <h1>Bringing tissue <span>together.</span></h1>
</section>
<script src="./tl-hero.js?v=3"></script>
<script>TLHero.mount(document.getElementById('art'));</script>
</body></html>
