<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cortex Innovation District — St. Louis</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<style>
  html, body { margin:0; height:100%; background:#0A1A2B; }
  #map { position:absolute; inset:0; background:#0A1A2B; }
  .leaflet-container { background:#0A1A2B; font-family: ui-sans-serif, system-ui, sans-serif; outline:none; }
  .leaflet-control-attribution { background:rgba(10,26,43,.72); color:#9FB4C6; font-size:9px; letter-spacing:.02em; }
  .leaflet-control-attribution a { color:#7FC4E8; }
  .tl-pin { position:relative; width:18px; height:18px; }
  .tl-pin i { position:absolute; inset:0; border-radius:50%; background:#2a7fdb; box-shadow:0 0 0 4px rgba(42,127,219,.22); display:block; }
  .tl-pin b { position:absolute; inset:-11px; border-radius:50%; border:1px solid rgba(42,127,219,.55); animation: tlping 3.4s cubic-bezier(.16,.84,.3,1) infinite; display:block; }
  .tl-pin b:nth-of-type(2) { animation-delay:1.7s; }
  @keyframes tlping { 0% { transform:scale(.5); opacity:.95 } 100% { transform:scale(3.4); opacity:0 } }
  /* The divIcon parent is 0px wide, so a block label shrink-wraps to nothing
     and only its padding gets the plate — size it to its own text instead. */
  .tl-label { display:inline-block; width:max-content; white-space:nowrap; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:#E9ECEF; font-weight:600;
    background:rgba(10,26,43,.88); padding:5px 9px; border:1px solid rgba(233,236,239,.18); transform:translate(20px,-9px); }
</style>
</head>
<body>
<div id="map"></div>
<script>
  var HQ = [38.63495, -90.25545];
  var map = L.map('map', {
    center: HQ, zoom: 14, zoomControl: false, attributionControl: false,
    dragging: false, scrollWheelZoom: false, doubleClickZoom: false,
    touchZoom: false, boxZoom: false, keyboard: false, zoomSnap: 0.25,
    // Leaflet's tile fade-in runs on requestAnimationFrame, which is suspended
    // while the document reports itself hidden — tiles would sit at opacity 0
    // forever inside an embedded preview.
    fadeAnimation: false
  });

  // Roads only: the transportation reference layer is street linework drawn on
  // a transparent background, so there is no landmass or water to hide. Each
  // tile is recoloured per pixel to the palette blue, keeping the source alpha
  // as the line mask — nothing else in the tile is painted.
  var Roads = L.GridLayer.extend({
    createTile: function (coords, done) {
      var size = this.getTileSize();
      var cv = document.createElement('canvas');
      cv.width = size.x; cv.height = size.y;
      var ctx = cv.getContext('2d');
      var img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function () {
        // Crop the source's outermost pixel row/column rather than overscanning:
        // the tiles carry a light edge artifact of their own, so stretching them
        // preserves the seam — discarding it removes the line entirely.
        var sw = img.naturalWidth || 256, sh = img.naturalHeight || 256;
        ctx.drawImage(img, 1, 1, sw - 2, sh - 2, 0, 0, size.x, size.y);
        var d;
        try { d = ctx.getImageData(0, 0, size.x, size.y); } catch (e) { done(null, cv); return; }
        var p = d.data;
        for (var i = 0; i < p.length; i += 4) {
          var a = p[i + 3];
          if (!a) continue;
          // Each road in the source is a light fill inside a dark casing; keep
          // only the fill so the map is single-weight lines with no outlines.
          var lum = (p[i] * 0.299 + p[i + 1] * 0.587 + p[i + 2] * 0.114) / 255;
          var k = (lum - 0.42) / 0.16;
          k = k < 0 ? 0 : k > 1 ? 1 : k;
          k = k * k * (3 - 2 * k);
          p[i]     = 127;
          p[i + 1] = 196;
          p[i + 2] = 232;
          p[i + 3] = Math.round(a * 0.78 * k);
        }
        ctx.putImageData(d, 0, 0);
        done(null, cv);
      };
      img.onerror = function () { done(null, cv); };
      img.src = 'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/'
        + coords.z + '/' + coords.y + '/' + coords.x;
      return cv;
    }
  });
  new Roads({ maxZoom: 16 }).addTo(map);

  L.marker(HQ, { icon: L.divIcon({
    className: '', iconSize: [18,18], iconAnchor: [9,9],
    html: '<div class="tl-pin"><b></b><b></b><i></i></div>'
  }), keyboard:false, interactive:false }).addTo(map);

  L.marker(HQ, { icon: L.divIcon({
    className: '', iconSize: [0,0], iconAnchor: [0,0],
    html: '<div class="tl-label">Cortex Innovation District</div>'
  }), keyboard:false, interactive:false }).addTo(map);

  // Static by design: the only motion is the marker's rings.
  window.addEventListener('load', function () { map.invalidateSize(); });
  window.addEventListener('resize', function () { map.invalidateSize(); });
</script>
</body>
</html>
